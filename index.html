<title>Food for the Family</title>
<style>

body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:78px}

header{position:sticky;top:0;z-index:5;background:linear-gradient(120deg,var(--hd1),var(--hd2));color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:0 2px 10px rgba(10,50,30,.25)}

header h1 svg{flex:none}
header select,header input[type=date]{background:rgba(255,255,255,.96);color:#16241b;border:0;font-weight:600}
header .btn.ghost{color:#fff;border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.12)}
select,input,button{font:inherit;color:inherit}
select,input[type=text],input[type=number],input[type=date],input[type=search],input[type=email]{background:var(--card);border:1.5px solid var(--line);border-radius:9px;padding:9px 11px;width:100%}
select:focus,input:focus{outline:2px solid var(--acc);border-color:var(--acc)}
label{display:block;font-size:12px;font-weight:600;color:var(--mute);margin:10px 0 3px}
main{max-width:880px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}

.mute{color:var(--mute)}.small{font-size:12px}
.btn{background:var(--acc);color:var(--acc-ink);border:0;border-radius:9px;padding:10px 16px;font-weight:700;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.sm{padding:6px 12px;font-size:13px}

.chip.on{border-color:var(--acc);background:var(--acc);color:var(--acc-ink)}
.av{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:800;font-size:13px;flex:none}
.av.lg{width:42px;height:42px;font-size:18px}
.bar{height:10px;background:var(--track);border-radius:9px;overflow:hidden;position:relative}
.bar>i{display:block;height:100%;border-radius:9px;background:var(--g)}
.bar.a>i{background:var(--a)}.bar.r>i{background:var(--r)}
.bar .mk{position:absolute;top:0;bottom:0;width:2px;background:var(--tgt);opacity:.5}

/* ---------- storage layer: Supabase REST, or this-browser demo mode ---------- */
const CFG=window.FFL_CONFIG||{};
const REMOTE=!!(CFG.url&&CFG.key);
const SB=REMOTE?supabase.createClient(CFG.url,CFG.key):null;
const db={
  async req(method,path,body,prefer='return=representation'){
    const {data:{session}}=await SB.auth.getSession();
    const h={apikey:CFG.key,Authorization:'Bearer '+(session?.access_token||CFG.key),'Content-Type':'application/json',Prefer:prefer};
    const r=await fetch(CFG.url.replace(/\/$/,'')+'/rest/v1/'+path,{method,headers:h,body:body?JSON.stringify(body):undefined});
    if(!r.ok) throw new Error(method+' '+path.split('?')[0]+' failed: '+(await r.text()).slice(0,200));
    return method==='DELETE'?null:r.json();
  },
  loc(t){try{return JSON.parse(ls.get('ffl_'+t)||'[]')}catch(e){return[]}},
  save(t,a){ls.set('ffl_'+t,JSON.stringify(a))},
  async list(t,since){
    if(REMOTE) return this.req('GET',t+'?select=*&limit=20000'+(since?'&day=gte.'+since:'')+(t==='ffl_logs'?'':'&order=created_at'));
    const a=this.loc(t);return since?a.filter(x=>x.day>=since):a;
  },
  async insert(t,rows){
    if(REMOTE) return this.req('POST',t,rows);
    const a=this.loc(t);const out=rows.map(r=>({id:crypto.randomUUID(),created_at:new Date().toISOString(),...r}));
    this.save(t,a.concat(out));return out;
  },
  async upsert(t,row){
    if(REMOTE) return this.req('POST',t+'?on_conflict=member_id,day',[row],'resolution=merge-duplicates,return=representation');
    const a=this.loc(t);const i=a.findIndex(x=>x.member_id===row.member_id&&x.day===row.day);
    if(i<0){const n={id:crypto.randomUUID(),created_at:new Date().toISOString(),...row};a.push(n);this.save(t,a);return[n]}
    a[i]={...a[i],...row};this.save(t,a);return[a[i]];
  },
  async update(t,id,patch){
    if(REMOTE) return (await this.req('PATCH',t+'?id=eq.'+id,patch))[0];
    const a=this.loc(t);const i=a.findIndex(x=>x.id===id);a[i]={...a[i],...patch};this.save(t,a);return a[i];
  },
  async remove(t,id){
    if(REMOTE) return this.req('DELETE',t+'?id=eq.'+id);
    this.save(t,this.loc(t).filter(x=>x.id!==id));
  }
};

const SINCE_DAYS=120;

async function load(){
  const since=addDays(ymd(new Date()),-SINCE_DAYS);
  const [m,f,l]=await Promise.all([db.list('ffl_members'),db.list('ffl_foods'),db.list('ffl_logs',since)]);
  const dl=await db.list('ffl_daily',since).catch(()=>null);
  S.dailyOk=!!dl;S.daily=dl||[];
  S.members=m;S.logs=l;S.foods=f;
  const em=S.members.find(x=>S.email&&(x.email||'').toLowerCase()===S.email.toLowerCase());
  if(em&&!ls.get('ffl_me')){S.me=S.cur=em.id;ls.set('ffl_me',em.id);ls.set('ffl_cur',em.id)}
  if(!f.length){
    S.foods=await db.insert('ffl_foods',SEED.map(r=>Object.fromEntries([['name',r[0]],['serving',r[1]],...NK.map((k,i)=>[k,r[i+2]])])));
  }
  S.foods.sort((a,b)=>a.name.localeCompare(b.name));
  if(!S.members.find(x=>x.id===S.cur)) S.cur=S.members[0]?.id||null;
  if(!S.members.find(x=>x.id===S.me)) S.me=S.cur||'';
  S.loaded=true;
}

/* ---------- targets ---------- */
function ageYears(dob,on){const b=new Date(dob),n=on?parseDay(on):new Date();let a=n.getFullYear()-b.getFullYear();
  if(n.getMonth()<b.getMonth()||(n.getMonth()===b.getMonth()&&n.getDate()<b.getDate()))a--;return a}
function targets(m){
  const age=Math.max(ageYears(m.dob),3),male=m.sex==='M',w=+m.weight_kg,h=+m.height_cm,obj=m.objective,kid=age<19;
  const bmr=age<10?(male?22.7*w+495:22.5*w+499):10*w+6.25*h-5*age+(male?5:-161);
  const af={sedentary:1.2,light:1.375,moderate:1.55,active:1.725}[m.activity]||1.375;
  let kcal=bmr*af;
  if(kid) kcal*=obj==='lose'?0.92:obj==='gain'?1.12:1.08; else kcal+=obj==='lose'?-500:obj==='gain'?300:0;
  kcal=Math.max(kcal,1200);
  const pk=age<4?1.2:kid?(obj==='gain'?1.2:1.0):({lose:1.2,gain:1.6}[obj]||1.0);
  const protein=Math.min(pk*w,kcal*0.30/4);
  const fat=kcal*(kid?0.30:0.27)/9;
  const carbs=(kcal-protein*4-fat*9)/4;
  const calcium=age<4?500:age<10?550:age<19?850:1000;
  const iron=age<4?8:age<7?13:age<10?16:age<13?(male?16:28):age<16?(male?22:30):age<19?(male?26:30):(male?19:29);
  const vita=age<7?510:age<10?630:age<13?770:age<16?930:age<19?(male?1000:890):(male?1000:840);
  const vitc=age<10?40:age<19?70:(male?80:65);
  const b12=age<4?1.2:age<10?2.0:2.2;
  const folate=age<4?120:age<7?135:age<10?170:age<13?220:age<16?285:300;
  let water;
  if(age<14){const hs=w<=10?w*100:w<=20?1000+(w-10)*50:1500+(w-20)*20;water=Math.min(Math.max(hs*0.8,1000),2000)}
  else if(age<19)water=Math.min(Math.max(w*30,1800),3000);
  else water=Math.min(Math.max(w*33+({moderate:250,active:500}[m.activity]||0),2000),3500);
  water=Math.round(water/50)*50;
  const steps=age<6?10000:age<18?12000:age>=60?6000:obj==='lose'?10000:8000;
  const screen=age<6?60:age<18?120:180;
  return {water,steps,screen,kcal:Math.round(kcal/10)*10,protein:Math.round(protein),carbs:Math.round(carbs),fibre:Math.round(14*kcal/1000),fat:Math.round(fat),
    calcium,iron,vita,vitc,b12,folate,bmr:Math.round(bmr),age};
}
function status(n,p){
  if(n.t==='limit') return p<=1?{c:'g',l:'Within limit'}:p<=1.25?{c:'a',l:'A bit over'}:{c:'r',l:'Over'};
  if(n.t==='energy') return p<.85?{c:'a',l:'Low'}:p<=1.1?{c:'g',l:'On track'}:p<=1.25?{c:'a',l:'A bit high'}:{c:'r',l:'High'};
  if(n.t==='range') return p>=.8&&p<=1.15?{c:'g',l:'On track'}:{c:'a',l:p<.8?'Low':'High'};
  return p>=.95?{c:'g',l:'Met'}:p>=.7?{c:'a',l:'Almost'}:{c:'r',l:'Low'};
}

function totals(mid,day){
  const t=Object.fromEntries(NK.map(k=>[k,0]));
  for(const l of logsFor(mid,day)){const f=food(l.food_id);if(!f)continue;for(const k of NK)t[k]+=(+f[k]||0)*(+l.servings)}

}

 {k:'water',n:'Water',u:'L',val:d=>d.water_ml==null?null:d.water_ml/1000,tg:t=>t.water/1000},
 {k:'steps',n:'Steps',u:'steps',val:d=>d.steps,tg:t=>t.steps},

function nutBars(m,tot,t){
  return NUT.map(n=>{
    const p=t[n.k]?tot[n.k]/t[n.k]:0,s=status(n,p);
    return `<div class="nut"><div class="top"><span>${n.n}</span><span><b>${num(tot[n.k])}</b> / ${t[n.k]} ${n.u} <span class="tag ${s.c==='g'?'':s.c}">${s.l}</span></span></div>
    <div class="bar ${s.c==='g'?'':s.c}"><i style="width:${Math.min(p,1.4)/1.4*100}%"></i><span class="mk" style="left:${100/1.4}%"></span></div></div>`;
  }).join('');
}
function suggest(k,t){
  const n=NUT.find(x=>x.k===k);
  return S.foods.filter(f=>+f[k]>0&&+f.kcal<=450).map(f=>({f,s:(+f[k]/t[k])/((+f.kcal+60)/200)})).sort((a,b)=>b.s-a.s).slice(0,3).map(x=>x.f.name.split(' (')[0]);
}
function verdict(m,tot,t){
  const rows=NUT.map(n=>({n,p:tot[n.k]/t[n.k]}));
  const any=Object.values(tot).some(v=>v>0);
  if(!any) return `<div class="verdict a">Nothing logged yet for this day.</div>`;
  const low=rows.filter(r=>!r.n.t&&r.p<.7).sort((a,b)=>a.p-b.p);
  const kc=rows[0].p;
  let msg=[],cls='';
  if(kc>1.25){msg.push('Calories are well over target.');cls='r'}
  else if(kc>1.1){msg.push('Calories are slightly over target.');cls='a'}
  if(low.length){
    cls=cls||'a';
    msg.push(`Low so far: <b>${low.slice(0,4).map(r=>r.n.n.toLowerCase()).join(', ')}</b>.`);
    const s=suggest(low[0].n.k,t);if(s.length) msg.push(`For ${low[0].n.n.toLowerCase()}, try ${s.join(', ')}.`);
  }
  if(!msg.length) msg.push('Looking good — on track for every nutrient so far. 🎉');
  return `<div class="verdict ${cls}">${msg.join(' ')}</div>`;
}

function drawCharts(){
  charts.forEach(c=>c.destroy());charts=[];

  const t=targets(m),cs=getComputedStyle(document.documentElement),css=v=>cs.getPropertyValue(v).trim();

  const per=days.map(d=>logsFor(m.id,d).length?totals(m.id,d):null);

    ...ACTS.map(n=>({n,vals:days.map(d=>{const x=dailyFor(m.id,d);return x?n.val(x):null}),tg:n.tg(t)}))];
  for(const {n,vals,tg} of specs){

      {type:'bar',data:vals.map(v=>v==null?null:r1(v)),backgroundColor:cols,borderRadius:3,order:2},

  }
}

/* ---------- forms ---------- */
function memberForm(id,pre={}){
  const m=id?member(id):{email:'',name:pre.n||'',sex:pre.s||'F',dob:'',height_cm:'',weight_kg:'',activity:pre.o==='growth'?'moderate':'light',objective:pre.o||'maintain'};
  const sel=(name,val,opts)=>`<select name="${name}">${opts.map(([v,l])=>`<option value="${v}" ${v===val?'selected':''}>${l}</option>`).join('')}</select>`;
  $('#dlg').innerHTML=`<form onsubmit="saveMember(event,'${id||''}')"><h3>${id?'Edit':'Add'} member</h3>
  <label>Name</label><input type="text" name="name" required value="${esc(m.name)}">
  <div class="two"><div><label>Sex</label>${sel('sex',m.sex,[['F','Female'],['M','Male']])}</div><div><label>Date of birth</label><input type="date" name="dob" required value="${esc(m.dob)}"></div></div>
  <div class="two"><div><label>Height (cm)</label><input type="number" name="height" required min="60" max="230" step="0.5" value="${esc(m.height_cm)}"></div><div><label>Weight (kg)</label><input type="number" name="weight" required min="8" max="250" step="0.1" value="${esc(m.weight_kg)}"></div></div>
  <label>Google email (so this person is recognised on sign-in — optional)</label><input type="email" name="email" value="${esc(m.email||'')}">
  <label>Activity level</label>${sel('activity',m.activity,[['sedentary','Mostly sitting'],['light','Light (some walking / play)'],['moderate','Moderate (regular exercise / very active child)'],['active','Very active (daily hard exercise)']])}
  <label>Objective</label>${sel('objective',m.objective,[['growth','Healthy growth (kids)'],['maintain','Maintain weight'],['lose','Weight loss'],['gain','Muscle gain']])}
  <div class="row" style="margin-top:16px">${id?`<button type="button" class="btn danger sm" onclick="delMember('${id}')">Delete</button>`:''}<span class="sp"></span><button type="button" class="btn ghost" onclick="$('#dlg').close()">Cancel</button><button class="btn">Save</button></div></form>`;
  $('#dlg').showModal();
}
async function saveMember(e,id){
  e.preventDefault();const f=new FormData(e.target);
  const row={name:f.get('name').trim(),sex:f.get('sex'),dob:f.get('dob'),height_cm:+f.get('height'),weight_kg:+f.get('weight'),activity:f.get('activity'),objective:f.get('objective'),email:(f.get('email')||'').trim().toLowerCase()||null};
  try{
    if(id){const r=await db.update('ffl_members',id,row);S.members=S.members.map(x=>x.id===id?r:x)}
    else{const [r]=await db.insert('ffl_members',[row]);S.members.push(r);S.cur=r.id;if(!S.me)S.me=r.id;ls.set('ffl_cur',S.cur);ls.set('ffl_me',S.me)}
    $('#dlg').close();fillMe();render();toast('Saved');
  }catch(err){fail(err)}
}
async function delMember(id){
  if(!confirm('Delete this person and ALL their food records? This cannot be undone.'))return;
  try{await db.remove('ffl_members',id);S.members=S.members.filter(x=>x.id!==id);S.logs=S.logs.filter(l=>l.member_id!==id);
    if(S.cur===id)S.cur=S.members[0]?.id||null;$('#dlg').close();fillMe();render()}catch(err){fail(err)}
}
function foodForm(id){
  const f=id?food(id):{name:'',serving:'',...Object.fromEntries(NK.map(k=>[k,'']))};
  $('#dlg').innerHTML=`<form onsubmit="saveFood(event,'${id||''}')"><h3>${id?'Edit':'New'} food</h3>
  <label>Name</label><input type="text" name="name" required value="${esc(f.name)}">
  <label>One serving is… (e.g. 1 katori, 2 idlis)</label><input type="text" name="serving" required value="${esc(f.serving)}">
  <div class="small mute" style="margin-top:8px">Nutrients in ONE serving:</div>
  <div class="three">${NUT.map(n=>`<div><label>${n.n} (${n.u})</label><input type="number" name="${n.k}" step="any" min="0" value="${esc(f[n.k])}" placeholder="0"></div>`).join('')}</div>
  <div class="row" style="margin-top:16px">${id?`<button type="button" class="btn danger sm" onclick="delFood('${id}')">Delete</button>`:''}<span class="sp"></span><button type="button" class="btn ghost" onclick="$('#dlg').close()">Cancel</button><button class="btn">Save</button></div></form>`;
  $('#dlg').showModal();
}
async function saveFood(e,id){
  e.preventDefault();const f=new FormData(e.target);
  const row={name:f.get('name').trim(),serving:f.get('serving').trim(),...Object.fromEntries(NK.map(k=>[k,+f.get(k)||0]))};
  try{
    if(id){const r=await db.update('ffl_foods',id,row);S.foods=S.foods.map(x=>x.id===id?r:x)}
    else{const [r]=await db.insert('ffl_foods',[row]);S.foods.push(r)}
    S.foods.sort((a,b)=>a.name.localeCompare(b.name));$('#dlg').close();render();toast('Saved');
  }catch(err){fail(err)}
}
async function delFood(id){
  if(S.logs.some(l=>l.food_id===id)){alert('This food is in someone\'s records, so it can\'t be deleted. Edit it instead.');return}
  if(!confirm('Delete this food?'))return;
  try{await db.remove('ffl_foods',id);S.foods=S.foods.filter(x=>x.id!==id);$('#dlg').close();render()}
  catch(err){alert('Could not delete — it is probably used in older records. Edit it instead.')}
}

/* ---------- actions ---------- */
function fail(err){console.error(err);alert('Something went wrong: '+err.message)}
async function addLog(fid){
  const ex=S.logs.find(l=>l.member_id===S.cur&&l.day===S.day&&l.meal===S.meal&&l.food_id===fid);
  try{
    if(ex){const r=await db.update('ffl_logs',ex.id,{servings:+ex.servings+1});Object.assign(ex,r)}
    else{const [r]=await db.insert('ffl_logs',[{member_id:S.cur,food_id:fid,day:S.day,meal:S.meal,servings:1,logged_by:meName()}]);S.logs.push(r)}
    refreshToday();toast('Added to '+S.meal);
  }catch(err){fail(err)}
}
async function stepLog(id,d){
  const l=S.logs.find(x=>x.id===id);const v=Math.max(0.5,+l.servings+d);
  try{const r=await db.update('ffl_logs',id,{servings:v});Object.assign(l,r);refreshToday()}catch(err){fail(err)}
}
async function delLog(id){try{await db.remove('ffl_logs',id);S.logs=S.logs.filter(l=>l.id!==id);refreshToday()}catch(err){fail(err)}}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,id=el.dataset.id;
  if(a==='tab'){S.tab=el.dataset.t;ls.set('ffl_tab',S.tab);render()}
  else if(a==='member'){S.cur=id;ls.set('ffl_cur',id);render()}
  else if(a==='go'){S.cur=id;ls.set('ffl_cur',id);S.tab='today';render()}
  else if(a==='meal'){S.meal=el.dataset.m;document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.m===S.meal))}
  else if(a==='add')addLog(id);
  else if(a==='step')stepLog(id,+el.dataset.d);
  else if(a==='del')delLog(id);
  else if(a==='glass')saveDaily({water_ml:(dailyFor(S.cur,S.day)?.water_ml||0)+250});
  else if(a==='noscreen')saveDaily({screen_min:0});
  else if(a==='day'){const d=addDays(S.day,+el.dataset.d);if(d<=ymd(new Date())){S.day=d;render()}}
  else if(a==='range'){S.range=+el.dataset.n;render()}
  else if(a==='signout'){SB.auth.signOut().then(()=>location.reload())}
  else if(a==='newMember')memberForm(null,el.dataset);
  else if(a==='editMember')memberForm(id);
  else if(a==='newFood')foodForm();
  else if(a==='editFood')foodForm(id);
});
document.addEventListener('input',e=>{
  if(e.target.id==='wr'){const m=member(S.cur),t=targets(m),v=+e.target.value;$('#wv').textContent=fmtL(v);const s=status({},v/t.water);$('#wt').textContent=s.l;$('#wb').innerHTML=barHtml(v/t.water,s)}
  if(e.target.id==='sc'){const m=member(S.cur),t=targets(m),v=+e.target.value,s=status({t:'limit'},v/t.screen);$('#scv').innerHTML=`<b>${fmtHM(v)}</b> / limit ${fmtHM(t.screen)}`;$('#scb').innerHTML=barHtml(v/t.screen,s)}
  if(e.target.id==='q'){S.q=e.target.value;renderResults()}
  if(e.target.id==='fq'){S.fq=e.target.value;renderFoodList()}
});
document.addEventListener('change',e=>{
  if(e.target.id==='wr')saveDaily({water_ml:+e.target.value});
  if(e.target.id==='sc')saveDaily({screen_min:+e.target.value});
  if(e.target.id==='st')saveDaily({steps:e.target.value===''?null:Math.max(0,Math.round(+e.target.value))});
});
$('#daypick').addEventListener('change',e=>{if(e.target.value&&e.target.value<=ymd(new Date())){S.day=e.target.value;render()}});
$('#me').addEventListener('change',e=>{S.me=e.target.value;ls.set('ffl_me',S.me)});

/* ---------- shell ---------- */
function fillMe(){
  $('#me').innerHTML='<option value="">I am…</option>'+S.members.map(m=>`<option value="${m.id}" ${m.id===S.me?'selected':''}>${esc(m.name)}</option>`).join('');
}
function render(){
  if(!S.loaded)return;
  charts.forEach(c=>c.destroy());charts=[];
  const IC={today:'<path d="M7 3v8M4 3v5a3 3 0 0 0 6 0V3M7 11v10M17 3c-2 1.5-3 4-3 7h3v11"/>',family:'<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14.5c2.5 0 4.5 2 4.5 4.5"/>',trends:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',foods:'<path d="M3 11h18a9 9 0 0 1-18 0z"/><path d="M8 7c0-1.5 1-1.5 1-3M12 7c0-1.5 1-1.5 1-3M16 7c0-1.5 1-1.5 1-3"/>',people:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/>'};
  const tabs=[['today','','Log'],['family','','Family'],['trends','','Graphs'],['foods','','Foods'],['people','','People']];
  $('#nav').innerHTML=tabs.map(([t,i,l])=>`<button class="${S.tab===t?'on':''}" data-act="tab" data-t="${t}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[t]}</svg><span>${l}</span></button>`).join('');
  $('#daynav').style.display=(S.tab==='today'||S.tab==='family')?'flex':'none';
  $('#daypick').value=S.day;$('#daypick').max=ymd(new Date());
  const banner=REMOTE?'':'<div class="banner">Demo mode: records are saved only on this phone. Connect Supabase (see README) to share with the family.</div>';
  $('#main').innerHTML=banner+({today:viewToday,family:viewFamily,trends:viewTrends,foods:viewFoods,people:viewPeople}[S.tab])();
  if(S.tab==='today')refreshToday();
  if(S.tab==='trends')drawCharts();
  if(S.tab==='foods')renderFoodList();
}

async function refresh(){
  if($('#dlg').open||['q','fq'].includes(document.activeElement?.id))return;
  try{await load();fillMe();render()}catch(e){console.warn(e)}
}
function gate(title,html){
  $('#nav').innerHTML='';$('#daynav').style.display='none';$('#me').style.display='none';
  $('#main').innerHTML=`<div class="card" style="max-width:420px;margin:40px auto;text-align:center"><h3>${title}</h3>${html}</div>`;
}
async function boot(){
  if(REMOTE){
    const {data:{session}}=await SB.auth.getSession();
    if(!session){
      gate('Family sign-in','<p class="mute">Only our family\'s Google accounts can open this app.</p><button class="btn" id="gbtn">Sign in with Google</button>');
      $('#gbtn').onclick=()=>SB.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname,queryParams:{prompt:'select_account'}}});
      return;
    }
    S.email=session.user.email;
    const ok=await SB.rpc('ffl_is_family');
    if(ok.error||!ok.data){
      gate('Not on the family list',`<p class="mute">${esc(S.email)} isn't allowed. Ask the admin to add this email, or sign in with a different Google account.</p><button class="btn ghost" id="sob">Sign out</button>`);
      $('#sob').onclick=()=>SB.auth.signOut().then(()=>location.reload());
      return;
    }
  }
  try{await load()}catch(err){$('#main').innerHTML=`<div class="card"><h3>Can't reach the database</h3><p class="mute">${esc(err.message)}</p><p>Check config.js and that setup.sql has been run in Supabase.</p></div>`;return}
  fillMe();render();
  if(REMOTE){setInterval(refresh,30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()})}
}
boot();
if(REMOTE)SB.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT')location.reload()});
</script>
</body>
</html>
